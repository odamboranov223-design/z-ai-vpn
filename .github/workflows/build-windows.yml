name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    name: windows binary
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: Build
        run: >-
          go build -trimpath
          -ldflags "-s -w -X github.com/odamboranov223-design/z-ai-vpn/internal/ui.Version=${{ github.ref_name }}"
          -o ZAIVPN.exe ./cmd/z-ai-vpn
      - name: Smoke test the binary
        run: .\ZAIVPN.exe -version
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAIVPN-windows-amd64
          path: ZAIVPN.exe
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZAIVPN-windows-amd64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ZAIVPN.exe
          generate_release_notes: true
